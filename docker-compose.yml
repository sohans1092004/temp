services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: udk
      POSTGRES_PASSWORD: udk_dev_password
      POSTGRES_DB: udk
    ports:
      - "5432:5432"
    volumes:
      - udk_postgres_data:/var/lib/postgresql/data

  minio:
    image: quay.io/minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: udk_minio
      MINIO_ROOT_PASSWORD: udk_dev_password
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - udk_minio_data:/data

  redpanda:
    image: redpandadata/redpanda:latest
    command:
      - redpanda
      - start
      - --smp=1
      - --memory=512M
      - --overprovisioned
      - --node-id=0
      - --kafka-addr=PLAINTEXT://0.0.0.0:9092
      - --advertise-kafka-addr=PLAINTEXT://localhost:9092
    ports:
      - "9092:9092"

volumes:
  udk_postgres_data:
  udk_minio_data:
